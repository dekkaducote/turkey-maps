var SKEY = 'turkeymaps:' + E.salt;
var te = new TextEncoder();
function b64(s) { var b = atob(s), a = new Uint8Array(b.length); for (var i = 0; i < b.length; i++) a[i] = b.charCodeAt(i); return a; }
function toB64(a) { var s = ''; a = new Uint8Array(a); for (var i = 0; i < a.length; i++) s += String.fromCharCode(a[i]); return btoa(s); }
function getStore(k) { try { return sessionStorage.getItem(k) || localStorage.getItem(k); } catch (e) { return null; } }
function forget() { try { sessionStorage.removeItem(SKEY); localStorage.removeItem(SKEY); } catch (e) {} }
function show(msg) { document.getElementById('box').style.display = 'block'; document.getElementById('msg').textContent = msg || ''; }

async function masterFromPassword(pw) {
  var k = await crypto.subtle.importKey('raw', te.encode(pw), 'PBKDF2', false, ['deriveBits']);
  return new Uint8Array(await crypto.subtle.deriveBits({name: 'PBKDF2', hash: 'SHA-256', salt: b64(E.salt), iterations: E.iter}, k, 256));
}
async function openWith(master) {
  var m = await crypto.subtle.importKey('raw', master, {name: 'HMAC', hash: 'SHA-256'}, false, ['sign']);
  var encKey = await crypto.subtle.importKey('raw', await crypto.subtle.sign('HMAC', m, te.encode('enc')), 'AES-CBC', false, ['decrypt']);
  var macKey = await crypto.subtle.importKey('raw', await crypto.subtle.sign('HMAC', m, te.encode('mac')), {name: 'HMAC', hash: 'SHA-256'}, false, ['verify']);
  var iv = b64(E.iv), ct = b64(E.ct), signed = new Uint8Array(iv.length + ct.length);
  signed.set(iv); signed.set(ct, iv.length);
  if (!(await crypto.subtle.verify('HMAC', macKey, b64(E.mac), signed))) return false;   // wrong password
  var html = new TextDecoder().decode(await crypto.subtle.decrypt({name: 'AES-CBC', iv: iv}, encKey, ct));
  document.open(); document.write(html); document.close();
  return true;
}

document.getElementById('f').addEventListener('submit', async function(e) {
  e.preventDefault();
  var go = document.getElementById('go'); go.disabled = true; show('Unlocking...');
  try {
    var master = await masterFromPassword(document.getElementById('pw').value);
    var keep = toB64(master);
    try {
      sessionStorage.setItem(SKEY, keep);
      if (document.getElementById('remember').checked) localStorage.setItem(SKEY, keep);
    } catch (err) {}
    if (!(await openWith(master))) { forget(); show('Wrong password. Try again.'); go.disabled = false; }
  } catch (err) { show('Could not unlock: ' + err.message); go.disabled = false; }
});

(async function() {
  if (!window.crypto || !crypto.subtle) {
    show('This viewer cannot unlock the map. Open the link in a web browser (Chrome, Safari, Firefox).'); return;
  }
  var saved = getStore(SKEY);
  if (saved) {
    try { if (await openWith(b64(saved))) return; } catch (err) {}
    forget();   // saved password no longer works (password changed)
  }
  show('');
  document.getElementById('pw').focus();
})();
